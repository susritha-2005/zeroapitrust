<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zero Trust Security Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      background: #020617;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #94a3b8;
    }

    .card p {
      font-size: 28px;
      margin: 10px 0 0;
      font-weight: bold;
    }

    .allow { color: #22c55e; }
    .block { color: #ef4444; }
    .log { color: #facc15; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }

    th { color: #94a3b8; }

    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .ALLOW { background: #22c55e; color: #022c22; }
    .BLOCK { background: #ef4444; color: #450a0a; }
    .LOG_ONLY { background: #facc15; color: #422006; }

    footer {
      text-align: center;
      padding: 15px;
      color: #64748b;
      font-size: 13px;
      margin-top: 30px;
    }

    select {
      padding: 8px;
      border-radius: 6px;
      background: #020617;
      color: white;
      border: 1px solid #1e293b;
    }
  </style>
</head>

<body>

<header>🔐 Zero Trust API Security Dashboard</header>

<div class="container">

  <!-- STATS -->
  <div class="cards">
    <div class="card">
      <h3>Total Requests</h3>
      <p id="total">0</p>
    </div>
    <div class="card">
      <h3>Allowed</h3>
      <p id="allowed" class="allow">0</p>
    </div>
    <div class="card">
      <h3>Blocked</h3>
      <p id="blocked" class="block">0</p>
    </div>
    <div class="card">
      <h3>Suspicious</h3>
      <p id="logonly" class="log">0</p>
    </div>
  </div>

  <!-- CHART + FILTER -->
  <div style="display:flex; gap:30px; align-items:center; margin-bottom:20px;">
    <div style="width:280px; background:#020617; padding:20px; border-radius:12px;">
      <canvas id="decisionChart"></canvas>
    </div>

    <div>
      <label style="font-size:14px;color:#94a3b8;">Filter by Decision</label><br>
      <select id="decisionFilter" onchange="renderTable()">
        <option value="ALL">All</option>
        <option value="ALLOW">Allow</option>
        <option value="BLOCK">Block</option>
        <option value="LOG_ONLY">Suspicious</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <h2>Recent Security Events</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>User</th>
        <th>IP</th>
        <th>Endpoint</th>
        <th>Risk</th>
        <th>Decision</th>
      </tr>
    </thead>
   <tbody id="logsTable"></tbody>
  </table>

</div>

<footer>Zero Trust API Security • Evaluation-2 Prototype</footer>

<script>
const API = "http://localhost:3000";
let allLogs = [];
let chart;

async function getToken() {
  let token = localStorage.getItem("token");
  if (token) return token;

  const res = await fetch(`${API}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: "admin1" })
  });
  const data = await res.json();
  localStorage.setItem("token", data.token);
  return data.token;
}

async function loadDashboard() {
  const token = await getToken();
  const headers = { Authorization: `Bearer ${token}` };

  const statsRes = await fetch(`${API}/admin/stats`, { headers });
  const stats = await statsRes.json();

  document.getElementById("total").innerText = stats.total_requests;
  document.getElementById("allowed").innerText = stats.allowed_requests;
  document.getElementById("blocked").innerText = stats.blocked_requests;
  document.getElementById("logonly").innerText = stats.suspicious_requests;

  renderChart(stats.allowed_requests, stats.blocked_requests, stats.suspicious_requests);

  const logsRes = await fetch(`${API}/admin/logs`, { headers });
  const logsData = await logsRes.json();
  allLogs = logsData.logs || [];
  renderTable();
}

function renderChart(allow, block, log) {
  const ctx = document.getElementById("decisionChart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "pie",
    data: {
      labels: ["Allowed", "Blocked", "Suspicious"],
      datasets: [{
        data: [allow, block, log],
        backgroundColor: ["#22c55e", "#ef4444", "#facc15"]
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: { color: "#e5e7eb" }
        }
      }
    }
  });
}

function renderTable() {
  const filter = document.getElementById("decisionFilter").value;
  const tbody = document.getElementById("logsTable");
  tbody.innerHTML = "";

  allLogs
    .filter(l => filter === "ALL" || l.decision === filter)
    .forEach(log => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${new Date(log.timestamp).toLocaleTimeString()}</td>
        <td>${log.userId || "-"}</td>
        <td>${log.ip}</td>
        <td>${log.endpoint}</td>
        <td>${log.risk_score}</td>
        <td><span class="badge ${log.decision}">${log.decision}</span></td>
      `;
      tbody.appendChild(row);
    });
}

loadDashboard();
setInterval(loadDashboard, 5000);
</script>

</body>
</html>
